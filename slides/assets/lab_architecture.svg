<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Arquitectura del laboratorio auditd">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #063b22; }
      .label { font: 700 22px Arial, sans-serif; fill: #063b22; }
      .small { font: 18px Arial, sans-serif; fill: #24352d; }
      .box { fill: #ffffff; stroke: #0b7a3e; stroke-width: 3; rx: 10; }
      .soft { fill: #edf7f1; stroke: #0b7a3e; stroke-width: 2; rx: 10; }
      .accent { fill: #fff4e8; stroke: #f58220; stroke-width: 2; rx: 10; }
      .arrow { stroke: #0b7a3e; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b7a3e"/>
    </marker>
  </defs>
  <text x="50" y="52" class="title">Laboratorio controlado: una fuente de telemetria, dos detectores</text>

  <rect x="55" y="110" width="205" height="110" class="box"/>
  <text x="82" y="150" class="label">VM Linux</text>
  <text x="82" y="182" class="small">Ubuntu Server</text>
  <text x="82" y="207" class="small">Red NAT + snapshot</text>

  <rect x="335" y="110" width="215" height="110" class="soft"/>
  <text x="365" y="150" class="label">auditd</text>
  <text x="365" y="182" class="small">auditctl rules</text>
  <text x="365" y="207" class="small">exec + chmod + /tmp</text>

  <rect x="625" y="110" width="240" height="110" class="box"/>
  <text x="655" y="150" class="label">Logs</text>
  <text x="655" y="182" class="small">/var/log/audit/audit.log</text>
  <text x="655" y="207" class="small">ausearch + aureport</text>

  <rect x="940" y="110" width="260" height="110" class="accent"/>
  <text x="970" y="150" class="label">Dataset</text>
  <text x="970" y="182" class="small">parser + variables</text>
  <text x="970" y="207" class="small">padre, hijo, ruta, tiempo</text>

  <rect x="260" y="315" width="285" height="105" class="soft"/>
  <text x="292" y="357" class="label">Reglas tipo SIEM</text>
  <text x="292" y="389" class="small">condiciones explicitas</text>

  <rect x="735" y="315" width="300" height="105" class="soft"/>
  <text x="767" y="357" class="label">Isolation Forest</text>
  <text x="767" y="389" class="small">puntaje de anomalia</text>

  <rect x="500" y="445" width="285" height="58" class="accent"/>
  <text x="536" y="482" class="label">Comparacion de metricas</text>

  <path d="M260 165 H335" class="arrow"/>
  <path d="M550 165 H625" class="arrow"/>
  <path d="M865 165 H940" class="arrow"/>
  <path d="M1065 220 C1030 285 935 292 890 315" class="arrow"/>
  <path d="M1065 220 C990 300 500 300 405 315" class="arrow"/>
  <path d="M405 420 C450 448 490 462 500 474" class="arrow"/>
  <path d="M885 420 C840 448 800 462 785 474" class="arrow"/>
</svg>
