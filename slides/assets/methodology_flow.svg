<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="Flujo de metodologia experimental">
  <defs>
    <style>
      .stage { fill:#ffffff; stroke:#0b7a3e; stroke-width:3; rx:12; }
      .stage2 { fill:#edf7f1; stroke:#0b7a3e; stroke-width:3; rx:12; }
      .stage3 { fill:#fff4e8; stroke:#f58220; stroke-width:3; rx:12; }
      .num { font:700 24px Arial, sans-serif; fill:#f58220; }
      .label { font:700 22px Arial, sans-serif; fill:#063b22; }
      .small { font:18px Arial, sans-serif; fill:#26352d; }
      .arrow { stroke:#0b7a3e; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b7a3e"/>
    </marker>
  </defs>
  <rect x="45" y="105" width="170" height="145" class="stage"/>
  <text x="70" y="145" class="num">01</text>
  <text x="70" y="180" class="label">Laboratorio</text>
  <text x="70" y="213" class="small">VM + auditd</text>

  <rect x="265" y="105" width="180" height="145" class="stage2"/>
  <text x="290" y="145" class="num">02</text>
  <text x="290" y="180" class="label">Escenarios</text>
  <text x="290" y="213" class="small">normal / sospechoso</text>

  <rect x="495" y="105" width="180" height="145" class="stage"/>
  <text x="520" y="145" class="num">03</text>
  <text x="520" y="180" class="label">Telemetria</text>
  <text x="520" y="213" class="small">logs auditd</text>

  <rect x="725" y="105" width="190" height="145" class="stage2"/>
  <text x="750" y="145" class="num">04</text>
  <text x="750" y="180" class="label">Variables</text>
  <text x="750" y="213" class="small">padre-hijo-tiempo</text>

  <rect x="965" y="105" width="250" height="145" class="stage3"/>
  <text x="990" y="145" class="num">05</text>
  <text x="990" y="180" class="label">Comparacion</text>
  <text x="990" y="213" class="small">reglas vs ML</text>

  <path d="M215 178 H265" class="arrow"/>
  <path d="M445 178 H495" class="arrow"/>
  <path d="M675 178 H725" class="arrow"/>
  <path d="M915 178 H965" class="arrow"/>

  <text x="70" y="320" class="small">Criterio EAN: objetivo especifico -> etapa -> evidencia -> resultado</text>
  <line x1="70" y1="340" x2="815" y2="340" stroke="#f58220" stroke-width="4"/>
</svg>
